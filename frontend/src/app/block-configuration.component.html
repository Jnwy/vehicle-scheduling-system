@if (loadingInitial()) {
  <p class="empty muted" role="status">Loading data...</p>
}
@if (notice()) {
  <section class="notice toast" role="status" aria-live="polite" [class.error]="noticeKind() === 'error'" [class.success]="noticeKind() === 'success'" [class.warning]="noticeKind() === 'warning'">
    <span>{{ notice() }}</span>
    <button type="button" class="notice-close" aria-label="Dismiss message" (click)="notice.set('')">&times;</button>
  </section>
}

<section class="panel map-panel">
  <div class="section-header map-header">
    <div>
      <h2>Block traversal times</h2>
      <p>
        Each block shows its traversal time in seconds. Type a new value and press Enter or leave the field to save it.
        Saved services keep their existing timeline snapshots.
      </p>
    </div>
  </div>

  <app-track-map
    [topology]="topology()"
    mapPurpose="config"
    (blockTraversalChanged)="saveBlock($event)"
    />
</section>

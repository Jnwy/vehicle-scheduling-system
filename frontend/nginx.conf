server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The browser calls the API on the same origin as the page.
    location /api/ {
        proxy_pass http://backend:8000/;
    }

    # Angular routes such as /schedule are resolved by the client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

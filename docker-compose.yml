services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vehicle_scheduling
      POSTGRES_USER: vehicle_scheduling
      POSTGRES_PASSWORD: vehicle_scheduling
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehicle_scheduling -d vehicle_scheduling"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://vehicle_scheduling:vehicle_scheduling@database:5432/vehicle_scheduling
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    command: npm start -- --poll 1000
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  postgres_data:
